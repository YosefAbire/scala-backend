play.http.secret.key = "hicenter-scala-3-dev-secret-key-at-least-32-bytes"

play.filters.hosts {
  allowed = ["."]
}

play.filters.cors {
  allowedOrigins = ["http://localhost:3000", "http://localhost:3005", "http://127.0.0.1:3000", "http://127.0.0.1:3005"]
  allowedHttpMethods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allowedHttpHeaders = ["Accept", "Content-Type", "Authorization", "X-Requested-With"]
  supportsCredentials = true
}

play.filters.enabled += "play.filters.cors.CORSFilter"

# Database Configuration (PostgreSQL / SQLite)
db.default.driver = "org.postgresql.Driver"
db.default.url = "jdbc:postgresql://localhost:5433/hicenter"
db.default.username = "hicenter"
db.default.password = "hicenter"
